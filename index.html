<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Skill Labs Consultancy is your trusted partner for global education, career counseling, university admissions, and student/work visa assistance."
    />

    <title>Skill Labs Consultancy</title>

    <!-- 🔥 PRELOAD FONT (good for CLS) -->
    <link
      rel="preload"
      href="/assets/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- 🔥 PRELOAD HERO IMAGE (critical for LCP) -->
    <link rel="preload" as="image" href="/hero.webp" />

    <!-- 🔥 DNS + connection hints -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- ⚡ NON-BLOCKING CSS LOADING (IMPORTANT FIX) -->
    <link
      rel="stylesheet"
      href="/assets/vendor.css"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <link rel="stylesheet" href="/assets/vendor.css" />
    </noscript>
  </head>

  <body>
    <div id="root"></div>

    <!-- 🚀 React entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
